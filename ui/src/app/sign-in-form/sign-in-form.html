  <div class="bg-white shadow rounded-xl p-20 flex flex-col min-w-2xl h-fit space-y-8">
    <h1 class="text-4xl text-black text-center">Sign in</h1>
    <form class="space-y-6" (submit)="onSubmit($event)">
      <div class="flex flex-col space-y-3">
        <label>Username</label>
        <input
          class="px-4 py-3 inset-1 border border-gray-300 rounded-xl"
          type="text"
          placeholder="Enter your username"
          [formField]="signInForm.Username"
        />
      </div>
      <div class="flex flex-col space-y-3">
        <label>Password</label>
        <input
          class="px-4 py-3 border border-gray-300 rounded-xl"
          type="password"
          placeholder="Enter your password"
          [formField]="signInForm.Password"
        />
      </div>
      <button
        class="bg-gray-700 border-b-2 border-gray-500 w-full px-4 py-3 rounded-xl text-white font-bold mt-4 hover:bg-gray-600 hover:cursor-pointer"
        type="submit"
      >
        Enter
      </button>
    </form>
    <p>
      If you don't have an account
      <a 
        class="font-bold text-gray-600 underline"
        [routerLink]="['/sign-up']">Sign up here</a>
    </p>
  </div>
