<div class="h-dvh flex flex-col bg-gray-300 justify-center items-center">
  <div class="flex flex-col bg-white rounded-xl p-20 w-1/2 space-y-8 shadow">
    <div class="px-8 flex flex-row justify-between">
      <h1 class="font-bold text-2xl">Categories</h1>
      <a routerLink="/create-category" class="bg-gray-600 text-white rounded-xl text-center px-4 py-2 w-40">New</a>
    </div>
    <div class="flex flex-col rounded-xl px-8">
      <div class="flex flex-row font-bold bg-gray-200 p-2 rounded-tl-xl rounded-tr-xl">
        <div class="flex-2 text-center">Alias</div>
        <div class="flex-1 text-center">Created At</div>
        <div class="flex-1 text-center">Updated At</div>
      </div>
      @for (item of categories(); track $index; let last = $last, odd = $odd) {
        <div
          class="flex flex-row justify-between p-2 border-b border-gray-200 bg-gray-50"
          [class.rounded-bl-xl]="last"
          [class.rounded-br-xl]="last"
        >
          <div class="flex-2 text-center">{{ item.Alias }}</div>
          <div class="flex-1 text-center">{{ item.CreatedAt | date: 'dd-MM-yyyy' }}</div>
          <div class="flex-1 text-center">{{ item.UpdatedAt }}</div>
        </div>
      }
    </div>
  </div>
</div>
