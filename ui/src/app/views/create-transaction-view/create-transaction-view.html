<div class="flex flex-col w-full justify-center items-center">
  <div class="flex flex-col p-8 w-1/3 space-y-4 rounded-xl bg-white shadow">
    <h1 class="text-cyan-800 text-6xl font-bold">Save a new transaction</h1>
    <form class="flex flex-col space-y-4" (submit)="onSubmit($event)">
      <div class="flex flex-col space-y-1">
        <label>Amount</label>
        <input
          class="border rounded-xl px-4 py-2 bg-white"
          type="number"
          placeholder="0.00"
          step="0.01"
          [formField]="createTransactionForm.amount"
        />
      </div>
      <div class="flex flex-col space-y-1">
        <label>Execution Date</label>
        <input
          class="border rounded-xl px-4 py-2"
          type="date"
          [formField]="createTransactionForm.execution_date"
        />
      </div>
      <div class="flex flex-col space-y-1">
        <label>Account</label>
        <select class="border px-4 py-3 rounded-xl">
          @for (item of accounts(); track $index) {
            <option value="{{ item.id }}">{{ item.alias }}</option>
          }
        </select>
      </div>
      <div class="flex flex-col space-y-1">
        <label>Category</label>
        <select class="border px-4 py-3 rounded-xl">
          @for (item of categories(); track $index) {
            <option value="{{ item.Id }}">{{ item.Alias }}</option>
          }
        </select>
      </div>
      <button
        class="mt-4 border rounded-lg bg-cyan-800 text-white py-3 font-bold"
        type="submit"
        value="Save"
      >
        Save
      </button>
    </form>
  </div>
</div>
