  <div class="flex flex-col p-20 w-2xl space-y-4 rounded-xl bg-white shadow">
    <h1 class="text-cyan-800 text-6xl font-bold">Save a new transaction</h1>
    <form class="flex flex-col space-y-4" (submit)="onSubmit($event)">
      <div class="flex flex-col space-y-1">
        <label>Concept</label>
        <input
          class="border rounded-xl px-4 py-3 bg-white"
          type="text"
          placeholder="Type the concept"
          [formField]="createTransactionForm.Concept"
        />
      </div>
      <div class="flex flex-col space-y-1">
        <label>Amount</label>
        <input
          class="border rounded-xl px-4 py-2 bg-white"
          type="number"
          placeholder="0.00"
          step="0.01"
          [formField]="createTransactionForm.Amount"
        />
      </div>
      <div class="flex flex-col space-y-1">
        <label>Execution Date</label>
        <input
          class="border rounded-xl px-4 py-2"
          type="date"
          [formField]="createTransactionForm.ExecutionDate"
        />
      </div>
      <div class="flex flex-col space-y-1">
        <label>Account</label>
        <select 
          class="border px-4 py-3 rounded-xl"
          [formField]="createTransactionForm.AccountId">
          @for (item of accounts(); track item.id) {
            <option value="{{ item.id }}">{{ item.alias }}</option>
          }
        </select>
      </div>
      <div class="flex flex-col space-y-1">
        <label>Category</label>
        <select class="border px-4 py-3 rounded-xl" 
          [formField]="createTransactionForm.CategoryId">
          @for (item of categories(); track item.Id) {
            <option value="{{ item.Id }}">{{ item.Alias }}</option>
          }
        </select>
      </div>
      <div class="flex flex-col space-y-1">
        <label>Budget</label>
      </div>
      <button
        class="mt-4 border rounded-lg bg-cyan-800 text-white py-3 font-bold"
        type="submit"
        value="Save"
      >
        Save
      </button>
    </form>
  </div>
